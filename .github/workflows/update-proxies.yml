name: Update Telegram Proxies

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          pip install "git+https://github.com/alimghmi/mtproxychecker.git"

      - name: Update and verify proxy list
        run: |
          python update_proxies.py

      - name: Save updated proxy list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxies.json index.html
          git diff --cached --quiet || git commit -m "Auto-update verified proxy list"
          git push
