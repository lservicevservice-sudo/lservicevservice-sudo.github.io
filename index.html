<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Telegram Proxy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .proxy {
      background: white;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    }

    .proxy-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .online {
      color: green;
    }

    .unstable {
      color: #d98200;
    }

    .offline {
      color: red;
    }

    .unknown {
      color: #777;
    }

    .connect {
      display: block;
      text-decoration: none;
      text-align: center;
      background: #229ED9;
      color: white;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 17px;
    }

    .connect:hover {
      opacity: 0.9;
    }

    #loading {
      text-align: center;
      padding: 30px;
    }

    .updated {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<h1>Telegram Proxy</h1>

<div class="info">
  Выберите прокси и нажмите «Подключить»
</div>

<div id="loading">
  Загружаю свежий список...
</div>

<div id="proxies"></div>

<div class="updated" id="updated"></div>

<script>

async function loadProxies() {

  const loading = document.getElementById("loading");
  const container = document.getElementById("proxies");
  const updated = document.getElementById("updated");

  try {

    const response = await fetch(
      "proxies.json?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Ошибка загрузки");
    }

    const data = await response.json();

    loading.style.display = "none";

    data.proxies.forEach((proxy, index) => {

      const block = document.createElement("div");
      block.className = "proxy";

      let statusText = "Статус неизвестен";
      let statusClass = "unknown";

      if (proxy.status === "online") {
        statusText = "🟢 Online";
        statusClass = "online";
      }

      if (proxy.status === "unstable") {
        statusText = "🟠 Unstable";
        statusClass = "unstable";
      }

      if (proxy.status === "offline") {
        statusText = "🔴 Offline";
        statusClass = "offline";
      }

      block.innerHTML = 
        <div class="proxy-title">
          Proxy ${index + 1}
        </div>

        <div class="status ${statusClass}">
          ${statusText}
        </div>

        <a
          class="connect"
          href="${proxy.link}">
          Подключить
        </a>
      ;

      container.appendChild(block);

    });

    if (data.updated) {

      const date = new Date(data.updated);

      updated.innerText =
        "Последнее обновление: " +
        date.toLocaleString("ru-RU");

    }

  }

  catch(error) {

    loading.innerText =
      "Не удалось загрузить список прокси.";

  }

}

loadProxies();

</script>

</body>
</html>
</html>
